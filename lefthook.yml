rc: ./lefthook.rc

pre-commit:
  piped: true
  jobs:
    - name: prettier
      glob: "*.{ts,js,json,yml,yaml,md}"
      run: pnpm prettier --write {staged_files} && git add {staged_files}

    - name: typecheck-server
      root: "server/"
      run: pnpm tsc --noEmit

    - name: typecheck-client
      root: "client/"
      run: pnpm tsc -b --noEmit

    - name: oxlint
      glob: "*.{ts,js}"
      run: pnpm oxlint --fix {staged_files} && git add {staged_files}
